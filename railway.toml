# Railway / Zeabur 等基于仓库根目录构建的 PaaS 使用此配置。
# Vercel / Netlify 会忽略它，改用 vercel.json / netlify.toml。

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "backend/Dockerfile"

[deploy]
  startCommand = "node dist/index.js"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

# 持久卷：请按平台实际语法调整。
# Railway 在控制台 Volumes 里给服务挂载 /app/data 即可，
# 无需在文件里声明；Zeabur 同理。
# [[mounts]]
#   source = "readnetwork-data"
#   destination = "/app/data"
